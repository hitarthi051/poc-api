service: poc-serverless-typescript

plugins:
  - serverless-esbuild

provider:
  name: aws
  runtime: nodejs20.x
  timeout: 30
  region: eu-west-1
  versionFunctions: true
  environment:
    NODE_ENV: development
  apiGateway:
    restApiId: 693utogn2j
    restApiRootResourceId: hoxnr8or62

functions:
  api:
    name: blue-green-api
    handler: handler.handler
    events:
      - http:
          path: /get-all-users
          method: get
          integration: lambda
          request:
            uri:
              Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:blue-green-api:${stageVariables.lambdaAlias}/invocations
          cors:
            origin: "*"
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - Language
              - X-Requested-With
            allowCredentials: true
      - http:
          path: /get-tasks-by-username
          method: post
          integration: lambda
          request:
            uri:
              Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:blue-green-api:${stageVariables.lambdaAlias}/invocations
          cors:
